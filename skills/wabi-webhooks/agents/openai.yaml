interface:
  display_name: "Wabi webhooks"
  short_description: "Receive signed events in your app"
  default_prompt: "Use $wabi-webhooks to send Wabi message events to our backend and verify their signatures."
dependencies:
  tools:
    - type: "mcp"
      value: "wabi"
      description: "Wabi hosted MCP server"
      transport: "streamable_http"
      url: "https://getwabi.dev/api/mcp"
policy:
  allow_implicit_invocation: true
